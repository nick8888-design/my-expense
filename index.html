<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#fdf6e3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="账单管家">
<title>账单管家 · Bills & Games</title>
<link rel="manifest" href="./manifest.json">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #fdf6e3;
  --bg-2: #ffffff;
  --bg-3: #f5edd9;
  --bg-4: #e8dcc0;
  --text: #1a1a1a;
  --text-2: #5c4a2a;
  --text-3: #9c8d75;
  --line: #d4c69e;
  --line-soft: #ece4ce;
  --accent: #d4a574;
  --accent-dark: #8b6f3f;
  --accent-2: #c4633c;
  --green: #6b8e23;
  --warn: #c4633c;
  --orange: #e89a3b;
  --shadow-sm: 0 1px 3px rgba(92, 74, 42, 0.06), 0 1px 2px rgba(92, 74, 42, 0.08);
  --shadow-md: 0 4px 12px rgba(92, 74, 42, 0.10), 0 2px 4px rgba(92, 74, 42, 0.06);
  --shadow-lg: 0 10px 30px rgba(92, 74, 42, 0.14);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', 'Noto Sans SC', system-ui, sans-serif;
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
}

.container {
  max-width: 720px;
  margin: 0 auto;
  padding: 16px 14px 80px;
}

/* ========== 顶部 Header ========== */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
  padding: 4px 2px;
}
.header-title {
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.3px;
}
.header-title .icon { margin-right: 6px; }
.sync-indicator {
  font-size: 11px;
  color: var(--text-3);
  display: flex;
  align-items: center;
  gap: 4px;
}
.sync-indicator.syncing { color: var(--accent-dark); }
.sync-indicator.error { color: var(--warn); }
.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--green);
}
.sync-indicator.syncing .dot { background: var(--orange); animation: pulse 1s infinite; }
.sync-indicator.error .dot { background: var(--warn); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

/* ========== Tabs ========== */
.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  background: var(--bg-3);
  padding: 4px;
  border-radius: 12px;
}
.tab {
  flex: 1;
  padding: 10px 6px;
  background: transparent;
  border: none;
  border-radius: 9px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-2);
  cursor: pointer;
  transition: all 0.15s;
}
.tab.active {
  background: var(--bg-2);
  color: var(--accent-dark);
  box-shadow: var(--shadow-sm);
}

/* ========== 页面 ========== */
.page { display: none; }
.page.active { display: block; }

/* ========== 工具栏 ========== */
.toolbar {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.btn {
  padding: 10px 14px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  cursor: pointer;
  transition: all 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.btn:hover { background: var(--bg-3); }
.btn:active { transform: scale(0.97); }
.btn-primary {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}
.btn-primary:hover { background: var(--accent-dark); }
.btn-ghost {
  background: transparent;
  border-color: var(--line-soft);
  color: var(--text-2);
}
.btn-sm { padding: 6px 10px; font-size: 12px; }
.btn-danger {
  background: var(--warn);
  color: white;
  border-color: var(--warn);
}

/* ========== 提醒条 ========== */
.reminder-banner {
  background: linear-gradient(135deg, #fff8e8, #fff3d6);
  border: 1px solid #f0d97a;
  border-radius: 12px;
  padding: 12px 14px;
  margin-bottom: 14px;
  box-shadow: var(--shadow-sm);
}
.reminder-banner.urgent {
  background: linear-gradient(135deg, #ffeaea, #ffd4d4);
  border-color: #f4a4a4;
}
.reminder-banner .title {
  font-size: 12px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
}
.reminder-item {
  font-size: 12px;
  color: var(--text-2);
  padding: 3px 0;
}
.reminder-item .urgent { color: var(--warn); font-weight: 600; }

/* ========== 账单/游戏 卡片 ========== */
.card {
  background: var(--bg-2);
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 10px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--line-soft);
  transition: all 0.15s;
}
.card-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 8px;
  gap: 8px;
}
.card-name {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.3;
  flex: 1;
  min-width: 0;
}
.card-amount {
  font-family: 'JetBrains Mono', monospace;
  font-size: 16px;
  font-weight: 700;
  color: var(--accent-2);
  white-space: nowrap;
}
.card-meta {
  font-size: 12px;
  color: var(--text-3);
  display: flex;
  flex-wrap: wrap;
  gap: 6px 12px;
  margin-bottom: 10px;
}
.card-meta .label { color: var(--text-3); }
.card-meta .value { color: var(--text-2); font-weight: 500; }

/* 倒计时颜色 */
.countdown {
  display: inline-block;
  padding: 3px 8px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 700;
  font-family: 'JetBrains Mono', monospace;
}
.countdown.safe { background: rgba(107, 142, 35, 0.12); color: var(--green); }
.countdown.warn { background: rgba(232, 154, 59, 0.15); color: var(--orange); }
.countdown.danger { background: rgba(196, 99, 60, 0.15); color: var(--warn); }
.countdown.overdue { background: var(--warn); color: white; }

.card-actions {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.card-actions .btn { flex: 1; min-width: 80px; padding: 8px 10px; font-size: 12px; }

/* ========== 表单/模态框 ========== */
.modal-bg {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 12px;
}
.modal-bg.show { display: flex; }
.modal {
  background: var(--bg-2);
  border-radius: 16px;
  max-width: 480px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
}
.modal-head {
  padding: 16px 18px;
  border-bottom: 1px solid var(--line-soft);
}
.modal-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
}
.modal-body { padding: 16px 18px; }
.modal-foot {
  padding: 12px 18px;
  border-top: 1px solid var(--line-soft);
  background: var(--bg-3);
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  border-radius: 0 0 16px 16px;
}

.field {
  margin-bottom: 12px;
}
.field-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
  margin-bottom: 5px;
}
.field input, .field select, .field textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 9px;
  font-family: inherit;
  font-size: 14px;
  color: var(--text);
  background: var(--bg-2);
  outline: none;
}
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--accent);
}
.field-hint {
  font-size: 11px;
  color: var(--text-3);
  margin-top: 3px;
}

/* ========== 空状态 ========== */
.empty-state {
  text-align: center;
  padding: 50px 20px;
  color: var(--text-3);
}
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }
.empty-state .title { font-size: 14px; font-weight: 600; color: var(--text-2); margin-bottom: 4px; }
.empty-state .hint { font-size: 12px; }

/* ========== Toast ========== */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(26, 26, 26, 0.92);
  color: white;
  padding: 10px 18px;
  border-radius: 24px;
  font-size: 13px;
  font-weight: 500;
  z-index: 200;
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
}
.toast.show { opacity: 1; }

/* ========== 登录页 ========== */
.login-page {
  display: none;
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg, #fdf6e3, #f5edd9);
  z-index: 999;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 30px;
}
.login-page.show { display: flex; }
.login-card {
  background: var(--bg-2);
  border-radius: 18px;
  padding: 30px 24px;
  width: 100%;
  max-width: 360px;
  box-shadow: var(--shadow-lg);
  text-align: center;
}
.login-icon { font-size: 56px; margin-bottom: 14px; }
.login-title { font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
.login-sub { font-size: 13px; color: var(--text-3); margin-bottom: 20px; }

/* ========== 设置页 ========== */
.settings-section {
  background: var(--bg-2);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--line-soft);
}
.settings-section h3 {
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 10px;
}
.settings-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid var(--line-soft);
  font-size: 13px;
}
.settings-row:last-child { border-bottom: none; }
.settings-row .label { color: var(--text-2); }
.settings-row .value { color: var(--text-3); font-size: 11px; }

/* Hide */
.hidden { display: none !important; }

/* 滚动条 */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<!-- 登录页 -->
<div id="loginPage" class="login-page">
  <div class="login-card">
    <div class="login-icon">💰</div>
    <div class="login-title">账单管家</div>
    <div class="login-sub">输入密码访问数据</div>
    <div class="field">
      <input type="password" id="loginPwd" placeholder="密码" autocomplete="current-password">
    </div>
    <button id="loginBtn" class="btn btn-primary" style="width: 100%;">登录</button>
    <div id="loginMsg" style="margin-top: 12px; font-size: 12px; color: var(--warn);"></div>
  </div>
</div>

<!-- 主界面 -->
<div class="container" id="mainApp" style="display: none;">
  
  <div class="header">
    <div class="header-title"><span class="icon">💰</span>账单管家</div>
    <div class="sync-indicator" id="syncIndicator">
      <span class="dot"></span><span id="syncText">已同步</span>
    </div>
  </div>
  
  <div class="tabs">
    <button class="tab active" data-tab="bills">📅 账单</button>
    <button class="tab" data-tab="games">🎮 游戏</button>
    <button class="tab" data-tab="settings">⚙️ 设置</button>
  </div>
  
  <!-- ============ 账单页 ============ -->
  <div class="page active" id="page-bills">
    <div id="billsReminder"></div>
    
    <div class="toolbar">
      <button class="btn btn-primary" id="addBillBtn">+ 添加</button>
      <button class="btn btn-ghost" id="importBillsBtn">📥 导入 txt</button>
      <button class="btn btn-ghost" id="exportBillsBtn">📤 导出</button>
    </div>
    
    <div id="billsList"></div>
  </div>
  
  <!-- ============ 游戏页 ============ -->
  <div class="page" id="page-games">
    <div id="gamesReminder"></div>
    
    <div class="toolbar">
      <button class="btn btn-primary" id="addGameBtn">+ 添加</button>
    </div>
    
    <div id="gamesList"></div>
  </div>
  
  <!-- ============ 设置页 ============ -->
  <div class="page" id="page-settings">
    <div class="settings-section">
      <h3>☁️ 云同步</h3>
      <div class="settings-row">
        <span class="label">状态</span>
        <span class="value" id="syncStatusText">检查中...</span>
      </div>
      <div class="settings-row">
        <span class="label">VPS</span>
        <span class="value">nick-vps.duckdns.org</span>
      </div>
      <div style="display: flex; gap: 6px; margin-top: 8px;">
        <button class="btn btn-sm" id="manualSyncBtn">立即同步</button>
        <button class="btn btn-sm btn-danger" id="logoutBtn">退出登录</button>
      </div>
    </div>
    
    <div class="settings-section">
      <h3>📊 数据</h3>
      <div class="settings-row">
        <span class="label">账单数</span>
        <span class="value" id="statBills">-</span>
      </div>
      <div class="settings-row">
        <span class="label">游戏数</span>
        <span class="value" id="statGames">-</span>
      </div>
    </div>
    
    <div class="settings-section">
      <h3>ℹ️ 关于</h3>
      <div class="settings-row">
        <span class="label">版本</span>
        <span class="value">v3.0 · 账单 + 游戏</span>
      </div>
    </div>
  </div>
</div>

<!-- 账单编辑模态框 -->
<div class="modal-bg" id="billModal">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="billModalTitle">+ 添加账单</div>
    </div>
    <div class="modal-body">
      <div class="field">
        <label class="field-label">名称 *</label>
        <input type="text" id="billName" placeholder="例: TNB 电费">
      </div>
      <div class="field">
        <label class="field-label">金额 (RM) *</label>
        <input type="text" inputmode="decimal" id="billAmount" placeholder="例: 120">
      </div>
      <div class="field">
        <label class="field-label">上次还款日 *</label>
        <input type="date" id="billLastPaid">
      </div>
      <div class="field">
        <label class="field-label">周期 *</label>
        <select id="billCycle">
          <option value="monthly">每月</option>
          <option value="quarterly">每季度</option>
          <option value="yearly">每年</option>
          <option value="weekly">每周</option>
        </select>
      </div>
      <div class="field">
        <label class="field-label">付款网址 (可选)</label>
        <input type="url" id="billUrl" placeholder="https://...">
        <div class="field-hint">填了就显示 🔗 去付款 按钮</div>
      </div>
      <div class="field">
        <label class="field-label">备注 (可选)</label>
        <input type="text" id="billNote" placeholder="">
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-danger btn-sm hidden" id="billDeleteBtn">删除</button>
      <button class="btn btn-ghost" id="billCancelBtn">取消</button>
      <button class="btn btn-primary" id="billSaveBtn">保存</button>
    </div>
  </div>
</div>

<!-- 游戏编辑模态框 -->
<div class="modal-bg" id="gameModal">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="gameModalTitle">+ 添加游戏活动</div>
    </div>
    <div class="modal-body">
      <div class="field">
        <label class="field-label">游戏名 *</label>
        <input type="text" id="gameName" placeholder="例: 王者荣耀">
      </div>
      <div class="field">
        <label class="field-label">活动名 *</label>
        <input type="text" id="gameEvent" placeholder="例: 每日签到">
      </div>
      <div class="field">
        <label class="field-label">频率</label>
        <select id="gameFreq">
          <option value="daily">每天</option>
          <option value="weekly">每周</option>
          <option value="monthly">每月</option>
        </select>
      </div>
      <div class="field" id="gameWeekdayField">
        <label class="field-label">星期几</label>
        <select id="gameWeekday">
          <option value="1">星期一</option>
          <option value="2">星期二</option>
          <option value="3">星期三</option>
          <option value="4">星期四</option>
          <option value="5">星期五</option>
          <option value="6">星期六</option>
          <option value="0">星期日</option>
        </select>
      </div>
      <div class="field" id="gameDayOfMonthField">
        <label class="field-label">几号</label>
        <input type="number" id="gameDayOfMonth" min="1" max="31" placeholder="1-31">
      </div>
      <div class="field">
        <label class="field-label">时间</label>
        <input type="time" id="gameTime" value="20:00">
      </div>
      <div class="field">
        <label class="field-label">备注 (可选)</label>
        <input type="text" id="gameNote" placeholder="">
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-danger btn-sm hidden" id="gameDeleteBtn">删除</button>
      <button class="btn btn-ghost" id="gameCancelBtn">取消</button>
      <button class="btn btn-primary" id="gameSaveBtn">保存</button>
    </div>
  </div>
</div>

<!-- 导入 txt 模态框 -->
<div class="modal-bg" id="importModal">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title">📥 导入账单 txt</div>
    </div>
    <div class="modal-body">
      <div class="field">
        <div class="field-hint" style="margin-bottom: 8px; font-size: 12px;">
          <strong>格式</strong>: 每行一笔账单, 用 Tab 分隔<br>
          <code style="display: block; background: var(--bg-3); padding: 8px; border-radius: 6px; margin-top: 6px; font-size: 11px; font-family: 'JetBrains Mono', monospace;">名称<span style="color: var(--accent-dark)">⇥</span>金额<span style="color: var(--accent-dark)">⇥</span>上次还款日<span style="color: var(--accent-dark)">⇥</span>周期<span style="color: var(--accent-dark)">⇥</span>网址</code>
          <div style="margin-top: 8px;">
            <strong>周期</strong>: monthly, weekly, quarterly, yearly<br>
            <strong>日期</strong>: YYYY-MM-DD 格式 (例: 2026-05-13)<br>
            <strong>网址</strong>: 可空
          </div>
        </div>
      </div>
      <div class="field">
        <label class="field-label">粘贴或上传 txt 内容</label>
        <textarea id="importText" rows="10" style="font-family: 'JetBrains Mono', monospace; font-size: 12px;" placeholder="TNB电费	120	2026-05-25	monthly	https://www.mytnb.com.my
水费	35	2026-05-30	monthly	https://www.airselangor.com"></textarea>
      </div>
      <input type="file" id="importFile" accept=".txt,.csv" style="display: none;">
      <button class="btn btn-ghost btn-sm" id="importFileBtn">📄 从文件选取</button>
      <div id="importPreview" style="margin-top: 12px;"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="importCancelBtn">取消</button>
      <button class="btn btn-primary" id="importConfirmBtn">✓ 解析并导入</button>
    </div>
  </div>
</div>

<!-- 已付款确认模态框 -->
<div class="modal-bg" id="paidConfirmModal">
  <div class="modal" style="max-width: 360px;">
    <div class="modal-head">
      <div class="modal-title">还款完成了吗?</div>
    </div>
    <div class="modal-body">
      <p id="paidConfirmText" style="color: var(--text-2); font-size: 14px;"></p>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="paidCancelBtn">还没付</button>
      <button class="btn btn-primary" id="paidConfirmBtn">✓ 已还款</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============ 常量 ============
const API_URL = 'https://nick-vps.duckdns.org';
const APP_NAME = 'expense'; // 沿用 VPS 上的 expense 数据库
const STORAGE_TOKEN = 'expense_token';
const PAY_CLICK_KEY = 'expense_pay_clicks';

// ============ Utils ============
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// 计算下次还款日 (基于上次 + 周期)
function calcNextDue(lastPaidDate, cycle) {
  if (!lastPaidDate) return null;
  const d = new Date(lastPaidDate + 'T00:00:00');
  if (cycle === 'weekly') d.setDate(d.getDate() + 7);
  else if (cycle === 'monthly') d.setMonth(d.getMonth() + 1);
  else if (cycle === 'quarterly') d.setMonth(d.getMonth() + 3);
  else if (cycle === 'yearly') d.setFullYear(d.getFullYear() + 1);
  return d;
}
function calcDaysLeft(lastPaidDate, cycle) {
  const next = calcNextDue(lastPaidDate, cycle);
  if (!next) return null;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const diff = Math.round((next - today) / (24 * 60 * 60 * 1000));
  return diff;
}
function formatDate(dStr) {
  if (!dStr) return '-';
  return dStr;
}
const CYCLE_LABEL = {
  weekly: '每周',
  monthly: '每月',
  quarterly: '每季度',
  yearly: '每年'
};

// ============ IndexedDB ============
const DB_NAME = 'expense-bills-db';
const DB_VERSION = 1;
let db;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onerror = () => reject(req.error);
    req.onsuccess = () => { db = req.result; resolve(db); };
    req.onupgradeneeded = (e) => {
      const _db = e.target.result;
      if (!_db.objectStoreNames.contains('bills')) {
        _db.createObjectStore('bills', { keyPath: 'id' });
      }
      if (!_db.objectStoreNames.contains('games')) {
        _db.createObjectStore('games', { keyPath: 'id' });
      }
    };
  });
}

function uuid() {
  return Date.now().toString(36) + Math.random().toString(36).substr(2, 6);
}

const BillsStore = {
  async getAll() {
    return new Promise((resolve, reject) => {
      const tx = db.transaction('bills', 'readonly');
      const req = tx.objectStore('bills').getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  },
  async add(bill) {
    if (!bill.id) bill.id = uuid();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('bills', 'readwrite');
      const req = tx.objectStore('bills').put(bill);
      req.onsuccess = () => resolve(bill.id);
      req.onerror = () => reject(req.error);
    });
  },
  async delete(id) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction('bills', 'readwrite');
      const req = tx.objectStore('bills').delete(id);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  },
  async clear() {
    return new Promise((resolve, reject) => {
      const tx = db.transaction('bills', 'readwrite');
      const req = tx.objectStore('bills').clear();
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }
};

const GamesStore = {
  async getAll() {
    return new Promise((resolve, reject) => {
      const tx = db.transaction('games', 'readonly');
      const req = tx.objectStore('games').getAll();
      req.onsuccess = () => resolve(req.result || []);

// ============ 云同步 ============
let pushTimer = null;
function setSyncStatus(status, text) {
  const el = document.getElementById('syncIndicator');
  el.className = 'sync-indicator ' + (status || '');
  document.getElementById('syncText').textContent = text || '已同步';
  document.getElementById('syncStatusText').textContent = text || '已同步';
}

async function pullFromVPS() {
  const token = localStorage.getItem(STORAGE_TOKEN);
  if (!token) return null;
  try {
    setSyncStatus('syncing', '拉取中...');
    const res = await fetch(`${API_URL}/api/data/${APP_NAME}`, {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (!res.ok) {
      if (res.status === 401) {
        // token 失效 - 只清 token,不立刻踢人
        localStorage.removeItem(STORAGE_TOKEN);
        setSyncStatus('error', '登录已过期');
        showToast('登录已过期,请到设置重新登录');
        return null;
      }
      throw new Error('Pull failed: ' + res.status);
    }
    const data = await res.json();
    setSyncStatus('', '已同步');
    return data;
  } catch (e) {
    console.error('pullFromVPS:', e);
    setSyncStatus('error', '同步失败');
    return null;
  }
}

async function pushToVPS() {
  const token = localStorage.getItem(STORAGE_TOKEN);
  if (!token) return;
  try {
    setSyncStatus('syncing', '上传中...');
    const data = {
      bills: await BillsStore.getAll(),
      games: await GamesStore.getAll()
    };
    const res = await fetch(`${API_URL}/api/data/${APP_NAME}`, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token
      },
      body: JSON.stringify(data)
    });
    if (!res.ok) {
      if (res.status === 401) {
        localStorage.removeItem(STORAGE_TOKEN);
        setSyncStatus('error', '登录已过期');
        return;
      }
      throw new Error('Push failed: ' + res.status);
    }
    setSyncStatus('', '已同步');
  } catch (e) {
    console.error('pushToVPS:', e);
    setSyncStatus('error', '同步失败');
  }
}

function debouncePush() {
  if (pushTimer) clearTimeout(pushTimer);
  pushTimer = setTimeout(pushToVPS, 1500);
}

async function applyCloudData(data) {
  if (!data) return;
  await BillsStore.clear();
  await GamesStore.clear();
  for (const b of (data.bills || [])) await BillsStore.add(b);
  for (const g of (data.games || [])) await GamesStore.add(g);
}

function showLoginPage() {

document.getElementById('loginBtn').addEventListener('click', async () => {
  const pwd = document.getElementById('loginPwd').value.trim();
  const msg = document.getElementById('loginMsg');

  msg.style.color = 'var(--warn)';
  msg.textContent = '';

  btn.disabled = true;

  try {
    console.log('[LOGIN] Sending login request...');
    const res = await fetch(`${API_URL}/api/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pwd })
    });
    
    console.log('[LOGIN] Response status:', res.status);
    
    if (!res.ok) {
      if (res.status === 401) throw new Error('密码错误');
      throw new Error(`登录失败 (${res.status})`);

    const data = await res.json();
    console.log('[LOGIN] Got data:', { hasToken: !!data.token });

    localStorage.setItem(STORAGE_TOKEN, data.token);

// ============ 账单渲染 ============
async function renderBills() {
  const bills = await BillsStore.getAll();
  const list = document.getElementById('billsList');
  
  if (bills.length === 0) {
    list.innerHTML = `<div class="empty-state">
      <div class="icon">📅</div>
      <div class="title">还没有账单</div>
      <div class="hint">点 + 添加 或 📥 导入 txt 开始</div>
    </div>`;
    return;
  }
  
  // 按距离下次还款日排序
  const enriched = bills.map(b => ({
    ...b,
    daysLeft: calcDaysLeft(b.lastPaid, b.cycle)
  }));
  enriched.sort((a, b) => (a.daysLeft ?? 999) - (b.daysLeft ?? 999));
  
  list.innerHTML = enriched.map(b => {
    const days = b.daysLeft;
    const nextDate = calcNextDue(b.lastPaid, b.cycle);
    const nextStr = nextDate ? `${nextDate.getFullYear()}-${String(nextDate.getMonth()+1).padStart(2,'0')}-${String(nextDate.getDate()).padStart(2,'0')}` : '-';
    
    let countdownCls = 'safe', countdownText = '';
    if (days === null) {
      countdownCls = 'safe';
      countdownText = '未设定';
    } else if (days < 0) {
      countdownCls = 'overdue';
      countdownText = `已过期 ${Math.abs(days)} 天`;
    } else if (days === 0) {
      countdownCls = 'danger';
      countdownText = '今天到期';
    } else if (days <= 3) {
      countdownCls = 'danger';
      countdownText = `还有 ${days} 天`;
    } else if (days <= 7) {
      countdownCls = 'warn';
      countdownText = `还有 ${days} 天`;
    } else {
      countdownCls = 'safe';
      countdownText = `还有 ${days} 天`;
    }
    
    return `
      <div class="card">
        <div class="card-head">
          <div class="card-name">${escapeHtml(b.name)}</div>
          <div class="card-amount">RM ${(parseFloat(b.amount) || 0).toFixed(2)}</div>
        </div>
        <div class="card-meta">
          <div><span class="label">上次还款:</span> <span class="value">${formatDate(b.lastPaid)}</span></div>
          <div><span class="label">下次:</span> <span class="value">${nextStr}</span></div>
          <div><span class="label">周期:</span> <span class="value">${CYCLE_LABEL[b.cycle] || b.cycle}</span></div>
          <div><span class="countdown ${countdownCls}">${countdownText}</span></div>
          ${b.note ? `<div><span class="label">备注:</span> <span class="value">${escapeHtml(b.note)}</span></div>` : ''}
        </div>
        <div class="card-actions">
          ${b.url ? `<button class="btn btn-primary btn-sm" onclick="goPay('${b.id}')">🔗 去付款</button>` : ''}
          <button class="btn btn-sm" onclick="markPaid('${b.id}')">✓ 已还款</button>
          <button class="btn btn-ghost btn-sm" onclick="editBill('${b.id}')">编辑</button>
        </div>
      </div>
    `;
  }).join('');
}

async function renderBillsReminder() {
  const bills = await BillsStore.getAll();
  const urgent = bills
    .map(b => ({ ...b, daysLeft: calcDaysLeft(b.lastPaid, b.cycle) }))
    .filter(b => b.daysLeft !== null && b.daysLeft <= 7)
    .sort((a, b) => a.daysLeft - b.daysLeft);
  
  const el = document.getElementById('billsReminder');
  if (urgent.length === 0) { el.innerHTML = ''; return; }
  
  const hasOverdue = urgent.some(b => b.daysLeft < 0);
  el.innerHTML = `
    <div class="reminder-banner ${hasOverdue ? 'urgent' : ''}">
      <div class="title">⚠️ ${urgent.length} 笔账单即将到期</div>
      ${urgent.slice(0, 5).map(b => `
        <div class="reminder-item">
          ${escapeHtml(b.name)} · RM ${(parseFloat(b.amount) || 0).toFixed(2)}
          ${b.daysLeft < 0 ? `<span class="urgent">已过期 ${Math.abs(b.daysLeft)} 天</span>` :
            b.daysLeft === 0 ? '<span class="urgent">今天到期</span>' :
            `<span class="${b.daysLeft <= 3 ? 'urgent' : ''}">还有 ${b.daysLeft} 天</span>`}
        </div>
      `).join('')}
    </div>
  `;
}

document.getElementById('billSaveBtn').addEventListener('click', async () => {
  const name = document.getElementById('billName').value.trim();
  const amount = parseFloat(document.getElementById('billAmount').value);
  const lastPaid = document.getElementById('billLastPaid').value;
  const cycle = document.getElementById('billCycle').value;

  const note = document.getElementById('billNote').value.trim();

  document.getElementById('billModal').classList.remove('show');

  showToast(editingBillId ? '✓ 已更新' : '✓ 已添加');
});

// 返回 App 检测 - 弹确认框
let pendingPaidId = null;
function checkPendingPayments() {
  const clicks = JSON.parse(localStorage.getItem(PAY_CLICK_KEY) || '{}');
  const now = Date.now();
  // 找出 20 秒前点的 + 30 分钟内的
  const candidates = Object.entries(clicks).filter(([id, c]) => {
    const age = now - c.ts;
    return age > 20000 && age < 30 * 60 * 1000;
  });
  if (candidates.length === 0) return;
  
  const [id, c] = candidates[0];
  pendingPaidId = id;
  document.getElementById('paidConfirmText').textContent = `刚才打开了 ${c.name} (RM ${(c.amount || 0).toFixed(2)}) 的付款页面。你完成还款了吗?`;
  document.getElementById('paidConfirmModal').classList.add('show');
}

document.getElementById('paidCancelBtn').addEventListener('click', () => {
  if (pendingPaidId) {
    const clicks = JSON.parse(localStorage.getItem(PAY_CLICK_KEY) || '{}');
    delete clicks[pendingPaidId];
    localStorage.setItem(PAY_CLICK_KEY, JSON.stringify(clicks));
  }
  pendingPaidId = null;
  document.getElementById('paidConfirmModal').classList.remove('show');
});

document.getElementById('paidConfirmBtn').addEventListener('click', async () => {
  if (pendingPaidId) {
    await window.markPaid(pendingPaidId);
    const clicks = JSON.parse(localStorage.getItem(PAY_CLICK_KEY) || '{}');
    delete clicks[pendingPaidId];
    localStorage.setItem(PAY_CLICK_KEY, JSON.stringify(clicks));
  }
  pendingPaidId = null;
  document.getElementById('paidConfirmModal').classList.remove('show');
});

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) {
    // 清理 30 分钟前的旧记录
    const clicks = JSON.parse(localStorage.getItem(PAY_CLICK_KEY) || '{}');
    const now = Date.now();
    const cleaned = {};
    for (const [id, c] of Object.entries(clicks)) {
      if (now - c.ts < 30 * 60 * 1000) cleaned[id] = c;
    }
    localStorage.setItem(PAY_CLICK_KEY, JSON.stringify(cleaned));
    
    setTimeout(checkPendingPayments, 500);
  }
});

function parseImportText(text) {
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l && !l.startsWith('#'));
  const results = [];
  const errors = [];
  
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    // 支持 Tab 或多空格分隔
    const parts = line.split(/\t|\s{2,}/).map(p => p.trim()).filter(p => p);
    
    if (parts.length < 4) {
      errors.push(`第 ${i + 1} 行: 字段不足 (至少需 名称/金额/日期/周期)`);
      continue;
    }
    
    const [name, amountStr, lastPaid, cycle, url] = parts;
    const amount = parseFloat(amountStr.replace(/[^\d.-]/g, ''));
    
    if (isNaN(amount) || amount <= 0) {
      errors.push(`第 ${i + 1} 行: 金额无效 "${amountStr}"`);
      continue;
    }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(lastPaid)) {
      errors.push(`第 ${i + 1} 行: 日期格式应为 YYYY-MM-DD "${lastPaid}"`);
      continue;
    }
    if (!['weekly', 'monthly', 'quarterly', 'yearly'].includes(cycle)) {
      errors.push(`第 ${i + 1} 行: 周期应为 weekly/monthly/quarterly/yearly "${cycle}"`);
      continue;
    }
    
    results.push({ name, amount, lastPaid, cycle, url: url || '' });
  }
  
  return { results, errors };
}

document.getElementById('importText').addEventListener('input', () => {
  const text = document.getElementById('importText').value;
  if (!text.trim()) { document.getElementById('importPreview').innerHTML = ''; return; }
  const { results, errors } = parseImportText(text);
  
  let html = `<div style="font-size: 12px; color: var(--text-2); padding: 10px; background: var(--bg-3); border-radius: 8px;">`;
  html += `✓ 解析成功: <strong>${results.length}</strong> 笔`;
  if (errors.length > 0) {
    html += `<br>✗ 错误: <strong style="color: var(--warn);">${errors.length}</strong> 行<br>`;
    html += errors.slice(0, 5).map(e => `· ${escapeHtml(e)}`).join('<br>');
  }
  html += `</div>`;
  document.getElementById('importPreview').innerHTML = html;
});

document.getElementById('importConfirmBtn').addEventListener('click', async () => {
  const text = document.getElementById('importText').value.trim();
  if (!text) { showToast('请粘贴 txt 内容'); return; }
  const { results, errors } = parseImportText(text);
  if (results.length === 0) { showToast('未解析到有效数据'); return; }
  
  const mode = confirm(`将导入 ${results.length} 笔账单${errors.length ? ` (${errors.length} 行错误已跳过)` : ''}.\n\n确定 = 覆盖现有所有账单\n取消 = 追加到现有账单后`);
  
  if (mode) {
    // 覆盖
    await BillsStore.clear();
  }
  
  for (const r of results) {
    await BillsStore.add({
      id: uuid(),
      name: r.name,
      amount: r.amount,
      lastPaid: r.lastPaid,
      cycle: r.cycle,
      url: r.url,
      note: '',
      updatedAt: Date.now()
    });
  }
  
  document.getElementById('importModal').classList.remove('show');
  await renderAll();
  debouncePush();
  showToast(`✓ 已${mode ? '覆盖' : '追加'} ${results.length} 笔账单`);
});

// ============ 导出 txt ============
document.getElementById('exportBillsBtn').addEventListener('click', async () => {
  const bills = await BillsStore.getAll();
  if (bills.length === 0) { showToast('没有账单可导出'); return; }
  
  const lines = bills.map(b => 
    `${b.name}\t${b.amount}\t${b.lastPaid}\t${b.cycle}\t${b.url || ''}`
  ).join('\n');
  const blob = new Blob([lines], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `bills_${todayStr()}.txt`;
  a.click();
  URL.revokeObjectURL(url);
  showToast(`✓ 已导出 ${bills.length} 笔`);
});

// ============ 游戏 ============
function nextGameOccurrence(g) {
  const now = new Date();
  const [hh, mm] = (g.time || '20:00').split(':').map(Number);
  
  if (g.freq === 'daily') {
    const next = new Date(now);
    next.setHours(hh, mm, 0, 0);
    if (next <= now) next.setDate(next.getDate() + 1);
    return next;
  }
  if (g.freq === 'weekly') {
    const targetDay = parseInt(g.weekday);
    const next = new Date(now);
    next.setHours(hh, mm, 0, 0);
    const dayDiff = (targetDay - next.getDay() + 7) % 7;
    next.setDate(next.getDate() + dayDiff);
    if (next <= now) next.setDate(next.getDate() + 7);
    return next;
  }
  if (g.freq === 'monthly') {
    const targetDay = parseInt(g.dayOfMonth) || 1;
    const next = new Date(now.getFullYear(), now.getMonth(), targetDay, hh, mm, 0, 0);
    if (next <= now) next.setMonth(next.getMonth() + 1);
    return next;
  }
  return null;
}

function formatGameNext(date) {
  if (!date) return '-';
  const now = new Date();
  const diffMs = date - now;
  const diffH = Math.round(diffMs / (60 * 60 * 1000));
  const diffD = Math.floor(diffH / 24);
  
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  const hh = String(date.getHours()).padStart(2, '0');
  const mm = String(date.getMinutes()).padStart(2, '0');
  
  if (diffH < 1) return `${Math.round(diffMs / 60000)} 分钟后 · ${hh}:${mm}`;
  if (diffH < 24) return `${diffH} 小时后 · 今天 ${hh}:${mm}`;
  if (diffD === 1) return `明天 ${hh}:${mm}`;
  if (diffD < 7) return `${diffD} 天后 · ${m}-${d} ${hh}:${mm}`;
  return `${m}-${d} ${hh}:${mm}`;
}

async function renderGames() {
  const games = await GamesStore.getAll();
  const list = document.getElementById('gamesList');
  
  if (games.length === 0) {
    list.innerHTML = `<div class="empty-state">
      <div class="icon">🎮</div>
      <div class="title">还没有游戏活动</div>
      <div class="hint">点 + 添加 加入第一个</div>
    </div>`;
    return;
  }
  
  const enriched = games.map(g => ({ ...g, next: nextGameOccurrence(g) }));
  enriched.sort((a, b) => (a.next || 9e15) - (b.next || 9e15));
  
  list.innerHTML = enriched.map(g => {
    const hoursLeft = g.next ? (g.next - Date.now()) / (60 * 60 * 1000) : 999;
    const isSoon = hoursLeft < 6;
    return `
      <div class="card" style="${isSoon ? 'border-color: var(--accent-2); background: linear-gradient(135deg, #fff8e8, var(--bg-2));' : ''}">
        <div class="card-head">
          <div class="card-name">${escapeHtml(g.gameName)} · ${escapeHtml(g.eventName)}</div>
        </div>
        <div class="card-meta">
          <div><span class="label">下次:</span> <span class="value" style="${isSoon ? 'color: var(--accent-2); font-weight: 700;' : ''}">${formatGameNext(g.next)}</span></div>
          <div><span class="label">频率:</span> <span class="value">${g.freq === 'daily' ? '每天' : g.freq === 'weekly' ? '每周' : '每月'}</span></div>
          ${g.note ? `<div><span class="label">备注:</span> <span class="value">${escapeHtml(g.note)}</span></div>` : ''}
        </div>
        <div class="card-actions">
          <button class="btn btn-ghost btn-sm" onclick="editGame('${g.id}')">编辑</button>
        </div>
      </div>
    `;
  }).join('');
}

async function renderGamesReminder() {
  const games = await GamesStore.getAll();
  const urgent = games
    .map(g => ({ ...g, next: nextGameOccurrence(g) }))
    .filter(g => g.next && (g.next - Date.now()) < 24 * 60 * 60 * 1000)
    .sort((a, b) => a.next - b.next);
  
  const el = document.getElementById('gamesReminder');
  if (urgent.length === 0) { el.innerHTML = ''; return; }
  
  el.innerHTML = `
    <div class="reminder-banner">
      <div class="title">🎮 ${urgent.length} 个活动 24 小时内</div>
      ${urgent.slice(0, 5).map(g => `
        <div class="reminder-item">
          ${escapeHtml(g.gameName)} · ${escapeHtml(g.eventName)} — ${formatGameNext(g.next)}
        </div>
      `).join('')}
    </div>
  `;
}

let editingGameId = null;

function updateGameFreqFields() {
  const freq = document.getElementById('gameFreq').value;
  document.getElementById('gameWeekdayField').style.display = freq === 'weekly' ? 'block' : 'none';
  document.getElementById('gameDayOfMonthField').style.display = freq === 'monthly' ? 'block' : 'none';
}
document.getElementById('gameFreq').addEventListener('change', updateGameFreqFields);

document.getElementById('addGameBtn').addEventListener('click', () => {
  editingGameId = null;
  document.getElementById('gameModalTitle').textContent = '+ 添加游戏活动';
  document.getElementById('gameName').value = '';
  document.getElementById('gameEvent').value = '';
  document.getElementById('gameFreq').value = 'daily';
  document.getElementById('gameWeekday').value = '1';
  document.getElementById('gameDayOfMonth').value = '';
  document.getElementById('gameTime').value = '20:00';
  document.getElementById('gameNote').value = '';
  document.getElementById('gameDeleteBtn').classList.add('hidden');
  updateGameFreqFields();
  document.getElementById('gameModal').classList.add('show');
});

window.editGame = async function(id) {
  const games = await GamesStore.getAll();
  const g = games.find(x => x.id === id);
  if (!g) return;
  editingGameId = id;
  document.getElementById('gameModalTitle').textContent = '编辑游戏活动';
  document.getElementById('gameName').value = g.gameName || '';
  document.getElementById('gameEvent').value = g.eventName || '';
  document.getElementById('gameFreq').value = g.freq || 'daily';
  document.getElementById('gameWeekday').value = g.weekday || '1';
  document.getElementById('gameDayOfMonth').value = g.dayOfMonth || '';
  document.getElementById('gameTime').value = g.time || '20:00';
  document.getElementById('gameNote').value = g.note || '';
  document.getElementById('gameDeleteBtn').classList.remove('hidden');
  updateGameFreqFields();
  document.getElementById('gameModal').classList.add('show');
};

document.getElementById('gameCancelBtn').addEventListener('click', () => {
  document.getElementById('gameModal').classList.remove('show');
});

document.getElementById('gameSaveBtn').addEventListener('click', async () => {
  const gameName = document.getElementById('gameName').value.trim();
  const eventName = document.getElementById('gameEvent').value.trim();
  const freq = document.getElementById('gameFreq').value;
  const weekday = document.getElementById('gameWeekday').value;
  const dayOfMonth = document.getElementById('gameDayOfMonth').value;
  const time = document.getElementById('gameTime').value;
  const note = document.getElementById('gameNote').value.trim();
  
  if (!gameName) { showToast('请输入游戏名'); return; }
  if (!eventName) { showToast('请输入活动名'); return; }
  if (freq === 'monthly' && !dayOfMonth) { showToast('请输入几号'); return; }
  
  const game = {
    id: editingGameId || uuid(),
    gameName, eventName, freq, weekday, dayOfMonth, time, note,
    updatedAt: Date.now()
  };
  await GamesStore.add(game);
  document.getElementById('gameModal').classList.remove('show');
  await renderAll();
  debouncePush();
  showToast(editingGameId ? '✓ 已更新' : '✓ 已添加');
});

document.getElementById('gameDeleteBtn').addEventListener('click', async () => {
  if (!editingGameId) return;
  if (!confirm('确定删除此活动?')) return;
  await GamesStore.delete(editingGameId);
  document.getElementById('gameModal').classList.remove('show');
  await renderAll();
  debouncePush();
  showToast('✓ 已删除');
});

// ============ 统计 ============
async function renderStats() {
  document.getElementById('statBills').textContent = (await BillsStore.getAll()).length;
  document.getElementById('statGames').textContent = (await GamesStore.getAll()).length;
}

// ============ 渲染所有 ============
async function renderAll() {
  await renderBills();
  await renderBillsReminder();
  await renderGames();
  await renderGamesReminder();
  await renderStats();
}

// ============ 启动 ============
async function init() {
  await openDB();
  await renderAll();  // 先用本地数据渲染
  
  // 再尝试拉云端 (失败不影响)
  try {
    const cloud = await pullFromVPS();
    if (cloud) {
      await applyCloudData(cloud);
      await renderAll();
    }
  } catch (e) {
    console.error('Init cloud pull failed:', e);
  }
  
  // 每分钟刷新倒计时
  setInterval(renderAll, 60 * 1000);
}

(async () => {
  try {
    const token = localStorage.getItem(STORAGE_TOKEN);
    if (!token) {
      showLoginPage();
    } else {
      hideLoginPage();
      await init();
    }
  } catch (e) {
    console.error('Startup error:', e);
    // 即使启动错也别卡死,显示主界面让用户能用本地数据
    hideLoginPage();
  }
})();

// ============ Service Worker ============
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      // 清掉所有旧版本缓存 (但不影响当前 session)
      if ('caches' in window) {
        const keys = await caches.keys();
        for (const k of keys) {
          if (!k.includes('v3-2026-05-13')) {
            await caches.delete(k);
          }
        }
      }
      
      // 注册新 SW
      await navigator.serviceWorker.register('./sw.js');
    } catch (e) {
      console.error('SW setup error:', e);
    }
  });
}
