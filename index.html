<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#fdf6e3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="账单管家">
<title>账单管家 · Monthly Bills</title>
<link rel="manifest" href="./manifest.json">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #fdf6e3;
  --bg-2: #ffffff;
  --bg-3: #f5edd9;
  --bg-4: #e8dcc0;
  --text: #1a1a1a;
  --text-2: #5c4a2a;
  --text-3: #9c8d75;
  --line: #d4c69e;
  --line-soft: #ece4ce;
  --accent: #d4a574;
  --accent-dark: #8b6f3f;
  --accent-2: #c4633c;
  --green: #6b8e23;
  --warn: #c4633c;
  --orange: #e89a3b;
  --shadow-sm: 0 1px 3px rgba(92, 74, 42, 0.06), 0 1px 2px rgba(92, 74, 42, 0.08);
  --shadow-md: 0 4px 12px rgba(92, 74, 42, 0.10), 0 2px 4px rgba(92, 74, 42, 0.06);
  --shadow-lg: 0 10px 30px rgba(92, 74, 42, 0.14);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', 'Noto Sans SC', system-ui, sans-serif;
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
}

.container {
  max-width: 720px;
  margin: 0 auto;
  padding: 16px 14px 80px;
}

/* Header */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
  padding: 4px 2px;
}
.header-title { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
.header-title .icon { margin-right: 6px; }
.sync-indicator { font-size: 11px; color: var(--text-3); display: flex; align-items: center; gap: 4px; }
.sync-indicator.syncing { color: var(--accent-dark); }
.sync-indicator.error { color: var(--warn); }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
.sync-indicator.syncing .dot { background: var(--orange); animation: pulse 1s infinite; }
.sync-indicator.error .dot { background: var(--warn); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

/* Tabs */
.tabs {
  display: flex; gap: 8px; margin-bottom: 16px;
  background: var(--bg-3); padding: 4px; border-radius: 12px;
}
.tab {
  flex: 1; padding: 10px 6px; background: transparent; border: none;
  border-radius: 9px; font-family: inherit; font-size: 13px; font-weight: 600;
  color: var(--text-2); cursor: pointer; transition: all 0.15s;
}
.tab.active {
  background: var(--bg-2); color: var(--accent-dark); box-shadow: var(--shadow-sm);
}

.page { display: none; }
.page.active { display: block; }

/* Month picker */
.month-picker {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg-2); border-radius: 12px; padding: 10px;
  margin-bottom: 12px; box-shadow: var(--shadow-sm); border: 1px solid var(--line-soft);
}
.month-picker .arrow {
  width: 36px; height: 36px; border-radius: 8px; background: var(--bg-3);
  border: none; color: var(--text); font-size: 16px; font-weight: 700;
  cursor: pointer;
}
.month-picker .arrow:hover { background: var(--bg-4); }
.month-info { flex: 1; text-align: center; }
.month-label { font-size: 16px; font-weight: 700; color: var(--text); }
.month-stat { font-size: 11px; color: var(--text-3); margin-top: 2px; }

/* Total card */
.total-card {
  background: linear-gradient(135deg, var(--accent), var(--accent-dark));
  color: white;
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-md);
}
.total-card .label { font-size: 11px; opacity: 0.85; }
.total-card .amount {
  font-family: 'JetBrains Mono', monospace;
  font-size: 28px; font-weight: 700; letter-spacing: -0.5px;
  margin: 4px 0;
}
.total-card .sub { font-size: 11px; opacity: 0.85; }

/* Bill row */
.bill-row {
  background: var(--bg-2); border-radius: 12px; padding: 12px 14px;
  margin-bottom: 8px; box-shadow: var(--shadow-sm);
  border: 1px solid var(--line-soft); transition: all 0.15s;
  display: flex; align-items: center; gap: 12px;
}
.bill-row.paid { border-left: 3px solid var(--green); }
.bill-row.unpaid { border-left: 3px solid var(--line); opacity: 0.85; }

.bill-check {
  width: 24px; height: 24px; border-radius: 50%;
  border: 2px solid var(--line); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-2); cursor: pointer;
  font-size: 13px; color: white;
}
.bill-check.checked {
  background: var(--green); border-color: var(--green);
}
.bill-info { flex: 1; min-width: 0; }
.bill-name { font-size: 14px; font-weight: 700; color: var(--text); }
.bill-meta { font-size: 11px; color: var(--text-3); margin-top: 2px; }
.bill-meta .note { color: var(--text-2); font-style: italic; }
.bill-amount {
  font-family: 'JetBrains Mono', monospace;
  font-size: 15px; font-weight: 700; color: var(--accent-2);
  white-space: nowrap;
}
.bill-row.unpaid .bill-amount { color: var(--text-3); }
.bill-actions { display: flex; gap: 4px; }
.bill-actions .btn-icon {
  width: 30px; height: 30px; border-radius: 8px; background: transparent;
  border: none; cursor: pointer; font-size: 14px; color: var(--text-3);
}
.bill-actions .btn-icon:hover { background: var(--bg-3); color: var(--text); }

/* Buttons */
.toolbar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.btn {
  padding: 10px 14px; background: var(--bg-2); border: 1px solid var(--line);
  border-radius: 10px; font-family: inherit; font-size: 13px; font-weight: 600;
  color: var(--text); cursor: pointer; transition: all 0.15s;
  display: inline-flex; align-items: center; gap: 4px;
}
.btn:hover { background: var(--bg-3); }
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--accent); color: white; border-color: var(--accent); }
.btn-primary:hover { background: var(--accent-dark); }
.btn-ghost { background: transparent; border-color: var(--line-soft); color: var(--text-2); }
.btn-sm { padding: 6px 10px; font-size: 12px; }
.btn-danger { background: var(--warn); color: white; border-color: var(--warn); }

/* Modal */
.modal-bg {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
  z-index: 100; align-items: center; justify-content: center; padding: 12px;
}
.modal-bg.show { display: flex; }
.modal {
  background: var(--bg-2); border-radius: 16px; max-width: 480px; width: 100%;
  max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg);
}
.modal-head { padding: 16px 18px; border-bottom: 1px solid var(--line-soft); }
.modal-title { font-size: 16px; font-weight: 700; }
.modal-body { padding: 16px 18px; }
.modal-foot {
  padding: 12px 18px; border-top: 1px solid var(--line-soft); background: var(--bg-3);
  display: flex; gap: 8px; justify-content: flex-end; border-radius: 0 0 16px 16px;
}
.field { margin-bottom: 12px; }
.field-label { display: block; font-size: 12px; font-weight: 600; color: var(--text-2); margin-bottom: 5px; }
.field input, .field select, .field textarea {
  width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px;
  font-family: inherit; font-size: 14px; color: var(--text);
  background: var(--bg-2); outline: none;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
.field-hint { font-size: 11px; color: var(--text-3); margin-top: 3px; }

.empty-state { text-align: center; padding: 50px 20px; color: var(--text-3); }
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }
.empty-state .title { font-size: 14px; font-weight: 600; color: var(--text-2); margin-bottom: 4px; }
.empty-state .hint { font-size: 12px; }

.toast {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
  background: rgba(26,26,26,0.92); color: white; padding: 10px 18px;
  border-radius: 24px; font-size: 13px; font-weight: 500;
  z-index: 200; opacity: 0; transition: opacity 0.2s; pointer-events: none;
}
.toast.show { opacity: 1; }

/* Login */
.login-page {
  display: none; position: fixed; inset: 0;
  background: linear-gradient(135deg, #fdf6e3, #f5edd9); z-index: 999;
  flex-direction: column; align-items: center; justify-content: center; padding: 30px;
}
.login-page.show { display: flex; }
.login-card {
  background: var(--bg-2); border-radius: 18px; padding: 30px 24px;
  width: 100%; max-width: 360px; box-shadow: var(--shadow-lg); text-align: center;
}
.login-icon { font-size: 56px; margin-bottom: 14px; }
.login-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
.login-sub { font-size: 13px; color: var(--text-3); margin-bottom: 20px; }

/* History bars */
.history-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; background: var(--bg-2); border-radius: 10px;
  margin-bottom: 6px; box-shadow: var(--shadow-sm); border: 1px solid var(--line-soft);
  cursor: pointer;
}
.history-row:hover { background: var(--bg-3); }
.history-month { font-size: 13px; font-weight: 700; min-width: 65px; }
.history-bar-bg {
  flex: 1; height: 10px; background: var(--bg-3); border-radius: 5px; overflow: hidden;
}
.history-bar {
  height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-dark));
  border-radius: 5px;
}
.history-amount {
  font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700;
  color: var(--accent-2); min-width: 90px; text-align: right;
}
.history-count { font-size: 10px; color: var(--text-3); margin-top: 2px; }

/* Settings */
.settings-section {
  background: var(--bg-2); border-radius: 12px; padding: 14px; margin-bottom: 12px;
  box-shadow: var(--shadow-sm); border: 1px solid var(--line-soft);
}
.settings-section h3 { font-size: 13px; font-weight: 700; margin-bottom: 10px; }
.settings-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 0; border-bottom: 1px solid var(--line-soft); font-size: 13px;
}
.settings-row:last-child { border-bottom: none; }
.settings-row .label { color: var(--text-2); }
.settings-row .value { color: var(--text-3); font-size: 11px; }

/* Games */
.card {
  background: var(--bg-2); border-radius: 14px; padding: 14px; margin-bottom: 10px;
  box-shadow: var(--shadow-sm); border: 1px solid var(--line-soft);
}
.card-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; gap: 8px; }
.card-name { font-size: 15px; font-weight: 700; flex: 1; min-width: 0; }
.card-meta { font-size: 12px; color: var(--text-3); display: flex; flex-wrap: wrap; gap: 6px 12px; margin-bottom: 10px; }
.card-meta .label { color: var(--text-3); }
.card-meta .value { color: var(--text-2); font-weight: 500; }
.card-actions { display: flex; gap: 6px; flex-wrap: wrap; }

.reminder-banner {
  background: linear-gradient(135deg, #fff8e8, #fff3d6);
  border: 1px solid #f0d97a; border-radius: 12px;
  padding: 12px 14px; margin-bottom: 14px; box-shadow: var(--shadow-sm);
}
.reminder-banner .title { font-size: 12px; font-weight: 700; margin-bottom: 6px; }
.reminder-item { font-size: 12px; color: var(--text-2); padding: 3px 0; }

.hidden { display: none !important; }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<!-- 登录页 -->
<div id="loginPage" class="login-page">
  <div class="login-card">
    <div class="login-icon">💰</div>
    <div class="login-title">账单管家</div>
    <div class="login-sub">输入密码访问数据</div>
    <div class="field">
      <input type="password" id="loginPwd" placeholder="密码" autocomplete="current-password">
    </div>
    <button id="loginBtn" class="btn btn-primary" style="width: 100%;">登录</button>
    <div id="loginMsg" style="margin-top: 12px; font-size: 12px; color: var(--warn);"></div>
  </div>
</div>

<!-- 主界面 -->
<div class="container" id="mainApp" style="display: none;">
  
  <div class="header">
    <div class="header-title"><span class="icon">💰</span>账单管家</div>
    <div class="sync-indicator" id="syncIndicator">
      <span class="dot"></span><span id="syncText">已同步</span>
    </div>
  </div>
  
  <div class="tabs">
    <button class="tab active" data-tab="bills">📅 账单</button>
    <button class="tab" data-tab="history">📊 历史</button>
    <button class="tab" data-tab="games">🎮 游戏</button>
    <button class="tab" data-tab="settings">⚙️ 设置</button>
  </div>
  
  <!-- ============ 账单页 ============ -->
  <div class="page active" id="page-bills">
    <div class="month-picker">
      <button class="arrow" id="prevMonthBtn">‹</button>
      <div class="month-info">
        <div class="month-label" id="currentMonthLabel">2026 年 5 月</div>
        <div class="month-stat" id="currentMonthStat">-</div>
      </div>
      <button class="arrow" id="nextMonthBtn">›</button>
    </div>
    
    <div class="total-card">
      <div class="label">本月合计 · this month</div>
      <div class="amount" id="monthTotal">RM 0.00</div>
      <div class="sub" id="monthTotalSub">还没记账</div>
    </div>
    
    <div id="billsList"></div>
    
    <div class="toolbar" style="margin-top: 14px;">
      <button class="btn btn-primary" id="addTemplateBtn">+ 加新账单项</button>
      <button class="btn btn-ghost btn-sm" id="copyLastMonthBtn">↻ 复制上月数据</button>
    </div>
  </div>
  
  <!-- ============ 历史页 ============ -->
  <div class="page" id="page-history">
    <div class="total-card" style="background: linear-gradient(135deg, #6b8e23, #5a7a1f);">
      <div class="label">最近 12 个月总计</div>
      <div class="amount" id="totalAllMonths">RM 0.00</div>
      <div class="sub" id="totalAllMonthsSub">-</div>
    </div>
    
    <div style="margin-bottom: 8px; font-size: 13px; font-weight: 700; color: var(--text-2);">📊 月份对比</div>
    <div id="historyList"></div>
  </div>
  
  <!-- ============ 游戏页 ============ -->
  <div class="page" id="page-games">
    <div id="gamesReminder"></div>
    <div class="toolbar">
      <button class="btn btn-primary" id="addGameBtn">+ 添加</button>
    </div>
    <div id="gamesList"></div>
  </div>
  
  <!-- ============ 设置页 ============ -->
  <div class="page" id="page-settings">
    <div class="settings-section">
      <h3>☁️ 云同步</h3>
      <div class="settings-row">
        <span class="label">状态</span>
        <span class="value" id="syncStatusText">检查中...</span>
      </div>
      <div class="settings-row">
        <span class="label">VPS</span>
        <span class="value">nick-vps.duckdns.org</span>
      </div>
      <div style="display: flex; gap: 6px; margin-top: 8px;">
        <button class="btn btn-sm" id="manualSyncBtn">立即同步</button>
        <button class="btn btn-sm btn-danger" id="logoutBtn">退出登录</button>
      </div>
    </div>
    
    <div class="settings-section">
      <h3>📊 数据概览</h3>
      <div class="settings-row">
        <span class="label">账单项数</span>
        <span class="value" id="statTemplates">-</span>
      </div>
      <div class="settings-row">
        <span class="label">记录月份</span>
        <span class="value" id="statMonths">-</span>
      </div>
      <div class="settings-row">
        <span class="label">游戏活动数</span>
        <span class="value" id="statGames">-</span>
      </div>
    </div>
    
    <div class="settings-section">
      <h3>📥 数据管理</h3>
      <div style="display: flex; gap: 6px; flex-wrap: wrap;">
        <button class="btn btn-sm btn-ghost" id="exportDataBtn">📤 导出全部 (JSON)</button>
        <button class="btn btn-sm btn-ghost" id="importDataBtn">📥 导入 JSON</button>
      </div>
      <input type="file" id="importDataFile" accept=".json" style="display: none;">
    </div>
    
    <div class="settings-section">
      <h3>ℹ️ 关于</h3>
      <div class="settings-row">
        <span class="label">版本</span>
        <span class="value">v4.0 · 月度账单</span>
      </div>
    </div>
  </div>
</div>

<!-- 账单项编辑模态框 -->
<div class="modal-bg" id="templateModal">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="templateModalTitle">+ 加新账单项</div>
    </div>
    <div class="modal-body">
      <div class="field">
        <label class="field-label">名称 *</label>
        <input type="text" id="tplName" placeholder="例: 岳母带小孩 / 供车 / 贷款">
      </div>
      <div class="field">
        <label class="field-label">默认金额 (可选)</label>
        <input type="text" inputmode="decimal" id="tplDefault" placeholder="留空,每月手动填">
        <div class="field-hint">如果固定每月差不多,可以填一个,以后自动带入</div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-danger btn-sm hidden" id="tplDeleteBtn">删除</button>
      <button class="btn btn-ghost" id="tplCancelBtn">取消</button>
      <button class="btn btn-primary" id="tplSaveBtn">保存</button>
    </div>
  </div>
</div>

<!-- 还款记录编辑模态框 -->
<div class="modal-bg" id="entryModal">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="entryModalTitle">还款</div>
    </div>
    <div class="modal-body">
      <div class="field">
        <label class="field-label">账单项</label>
        <input type="text" id="entryTplName" readonly style="background: var(--bg-3); color: var(--text-2);">
      </div>
      <div class="field">
        <label class="field-label">金额 (RM) *</label>
        <input type="text" inputmode="decimal" id="entryAmount" placeholder="例: 350">
      </div>
      <div class="field">
        <label class="field-label">还款日期</label>
        <input type="date" id="entryDate">
      </div>
      <div class="field">
        <label class="field-label">备注 (可选)</label>
        <input type="text" id="entryNote" placeholder="">
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-danger btn-sm hidden" id="entryDeleteBtn">删除记录</button>
      <button class="btn btn-ghost" id="entryCancelBtn">取消</button>
      <button class="btn btn-primary" id="entrySaveBtn">保存</button>
    </div>
  </div>
</div>

<!-- 游戏编辑模态框 -->
<div class="modal-bg" id="gameModal">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="gameModalTitle">+ 添加游戏活动</div>
    </div>
    <div class="modal-body">
      <div class="field">
        <label class="field-label">游戏名 *</label>
        <input type="text" id="gameName" placeholder="例: 王者荣耀">
      </div>
      <div class="field">
        <label class="field-label">活动名 *</label>
        <input type="text" id="gameEvent" placeholder="例: 每日签到">
      </div>
      <div class="field">
        <label class="field-label">频率</label>
        <select id="gameFreq">
          <option value="daily">每天</option>
          <option value="weekly">每周</option>
          <option value="monthly">每月</option>
        </select>
      </div>
      <div class="field" id="gameWeekdayField">
        <label class="field-label">星期几</label>
        <select id="gameWeekday">
          <option value="1">星期一</option><option value="2">星期二</option>
          <option value="3">星期三</option><option value="4">星期四</option>
          <option value="5">星期五</option><option value="6">星期六</option>
          <option value="0">星期日</option>
        </select>
      </div>
      <div class="field" id="gameDayOfMonthField">
        <label class="field-label">几号</label>
        <input type="number" id="gameDayOfMonth" min="1" max="31" placeholder="1-31">
      </div>
      <div class="field">
        <label class="field-label">时间</label>
        <input type="time" id="gameTime" value="20:00">
      </div>
      <div class="field">
        <label class="field-label">备注 (可选)</label>
        <input type="text" id="gameNote">
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-danger btn-sm hidden" id="gameDeleteBtn">删除</button>
      <button class="btn btn-ghost" id="gameCancelBtn">取消</button>
      <button class="btn btn-primary" id="gameSaveBtn">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============ 常量 ============
const API_URL = 'https://nick-vps.duckdns.org';
const APP_NAME = 'expense';
const STORAGE_TOKEN = 'expense_token';

// ============ Utils ============
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function escapeHtml(s) {
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
function uuid() {
  return Date.now().toString(36) + Math.random().toString(36).substr(2, 6);
}
function monthKey(year, month) {
  // month: 1-12
  return `${year}-${String(month).padStart(2,'0')}`;
}
function parseMonthKey(key) {
  const [y, m] = key.split('-').map(Number);
  return { year: y, month: m };
}

// 当前显示的月份 (year-month, 1-12)
let viewYear, viewMonth;
function initCurrentMonth() {
  const d = new Date();
  viewYear = d.getFullYear();
  viewMonth = d.getMonth() + 1;
}

// ============ IndexedDB ============
const DB_NAME = 'expense-bills-db';
const DB_VERSION = 2;
let db;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onerror = () => reject(req.error);
    req.onsuccess = () => { db = req.result; resolve(db); };
    req.onupgradeneeded = (e) => {
      const _db = e.target.result;
      // 账单模板 (每月固定项)
      if (!_db.objectStoreNames.contains('templates')) {
        _db.createObjectStore('templates', { keyPath: 'id' });
      }
      // 还款记录: { id, templateId, year, month, amount, paidDate, note }
      if (!_db.objectStoreNames.contains('entries')) {
        const s = _db.createObjectStore('entries', { keyPath: 'id' });
        s.createIndex('byMonth', ['year', 'month']);
        s.createIndex('byTemplate', 'templateId');
      }
      if (!_db.objectStoreNames.contains('games')) {
        _db.createObjectStore('games', { keyPath: 'id' });
      }
      // 旧版的 bills store 不删,留着兼容
      if (!_db.objectStoreNames.contains('bills')) {
        _db.createObjectStore('bills', { keyPath: 'id' });
      }
    };
  });
}

const Store = {
  async getAll(name) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(name, 'readonly');
      const req = tx.objectStore(name).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  },
  async put(name, obj) {
    if (!obj.id) obj.id = uuid();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(name, 'readwrite');
      const req = tx.objectStore(name).put(obj);
      req.onsuccess = () => resolve(obj.id);
      req.onerror = () => reject(req.error);
    });
  },
  async delete(name, id) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(name, 'readwrite');
      const req = tx.objectStore(name).delete(id);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  },
  async clear(name) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(name, 'readwrite');
      const req = tx.objectStore(name).clear();
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }
};

// ============ 云同步 ============
let pushTimer = null;
function setSyncStatus(status, text) {
  const el = document.getElementById('syncIndicator');
  el.className = 'sync-indicator ' + (status || '');
  document.getElementById('syncText').textContent = text || '已同步';
  const sst = document.getElementById('syncStatusText');
  if (sst) sst.textContent = text || '已同步';
}

async function pullFromVPS() {
  const token = localStorage.getItem(STORAGE_TOKEN);
  if (!token) return null;
  try {
    setSyncStatus('syncing', '拉取中...');
    const res = await fetch(`${API_URL}/api/data/${APP_NAME}`, {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (!res.ok) {
      if (res.status === 401) {
        localStorage.removeItem(STORAGE_TOKEN);
        setSyncStatus('error', '登录已过期');
        showToast('登录已过期,请重新登录');
        return null;
      }
      throw new Error('Pull failed: ' + res.status);
    }
    const data = await res.json();
    setSyncStatus('', '已同步');
    return data;
  } catch (e) {
    console.error('pullFromVPS:', e);
    setSyncStatus('error', '同步失败');
    return null;
  }
}

async function pushToVPS() {
  const token = localStorage.getItem(STORAGE_TOKEN);
  if (!token) return;
  try {
    setSyncStatus('syncing', '上传中...');
    const data = {
      templates: await Store.getAll('templates'),
      entries: await Store.getAll('entries'),
      games: await Store.getAll('games')
    };
    const res = await fetch(`${API_URL}/api/data/${APP_NAME}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify(data)
    });
    if (!res.ok) {
      if (res.status === 401) {
        localStorage.removeItem(STORAGE_TOKEN);
        setSyncStatus('error', '登录已过期');
        return;
      }
      throw new Error('Push failed: ' + res.status);
    }
    setSyncStatus('', '已同步');
  } catch (e) {
    console.error('pushToVPS:', e);
    setSyncStatus('error', '同步失败');
  }
}

function debouncePush() {
  if (pushTimer) clearTimeout(pushTimer);
  pushTimer = setTimeout(pushToVPS, 1500);
}

async function applyCloudData(data) {
  if (!data) return;
  await Store.clear('templates');
  await Store.clear('entries');
  await Store.clear('games');
  
  for (const t of (data.templates || [])) await Store.put('templates', t);
  for (const e of (data.entries || [])) await Store.put('entries', e);
  for (const g of (data.games || [])) await Store.put('games', g);
  
  // 兼容: 如果云端有旧的 bills 数据 (老版本),迁移成 templates
  if (data.bills && Array.isArray(data.bills) && data.bills.length > 0) {
    const templates = await Store.getAll('templates');
    if (templates.length === 0) {
      // 旧版迁移
      for (const b of data.bills) {
        await Store.put('templates', {
          id: uuid(),
          name: b.name,
          defaultAmount: b.amount,
          createdAt: Date.now()
        });
      }
      showToast('✓ 从旧数据迁移了 ' + data.bills.length + ' 个账单项');
    }
  }
}

// ============ 登录 ============
function showLoginPage() {
  document.getElementById('loginPage').classList.add('show');
  document.getElementById('mainApp').style.display = 'none';
}
function hideLoginPage() {
  document.getElementById('loginPage').classList.remove('show');
  document.getElementById('mainApp').style.display = 'block';
}

document.getElementById('loginBtn').addEventListener('click', async () => {
  const pwd = document.getElementById('loginPwd').value.trim();
  const msg = document.getElementById('loginMsg');
  const btn = document.getElementById('loginBtn');
  msg.style.color = 'var(--warn)';
  msg.textContent = '';
  if (!pwd) { msg.textContent = '请输入密码'; return; }
  btn.disabled = true;
  btn.textContent = '登录中...';
  try {
    const res = await fetch(`${API_URL}/api/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pwd })
    });
    if (!res.ok) {
      if (res.status === 401) throw new Error('密码错误');
      throw new Error(`登录失败 (${res.status})`);
    }
    const data = await res.json();
    if (!data.token) throw new Error('服务器未返回 token');
    localStorage.setItem(STORAGE_TOKEN, data.token);
    msg.style.color = 'var(--green)';
    msg.textContent = '✓ 登录成功';
    await new Promise(r => setTimeout(r, 300));
    hideLoginPage();
    try { await init(); } catch (e) { console.error('Init err:', e); }
  } catch (e) {
    msg.style.color = 'var(--warn)';
    msg.textContent = '✗ ' + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = '登录';
  }
});

document.getElementById('loginPwd').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') document.getElementById('loginBtn').click();
});

document.getElementById('logoutBtn').addEventListener('click', () => {
  if (!confirm('确定退出登录?')) return;
  localStorage.removeItem(STORAGE_TOKEN);
  showLoginPage();
});

document.getElementById('manualSyncBtn').addEventListener('click', async () => {
  const cloud = await pullFromVPS();
  if (cloud) {
    await applyCloudData(cloud);
    await renderAll();
    showToast('✓ 已从云端同步');
  }
});

// ============ 月份切换 ============
document.getElementById('prevMonthBtn').addEventListener('click', () => {
  viewMonth--;
  if (viewMonth < 1) { viewMonth = 12; viewYear--; }
  renderBills();
});

  viewMonth++;
  if (viewMonth > 12) { viewMonth = 1; viewYear++; }
  renderBills();
});

// ============ 账单渲染 ============
async function renderBills() {
  // 更新月份显示
  document.getElementById('currentMonthLabel').textContent = `${viewYear} 年 ${viewMonth} 月`;
  
  const templates = await Store.getAll('templates');
  const allEntries = await Store.getAll('entries');
  const monthEntries = allEntries.filter(e => e.year === viewYear && e.month === viewMonth);
  
  if (templates.length === 0) {
    document.getElementById('billsList').innerHTML = `<div class="empty-state">
      <div class="icon">📅</div>
      <div class="title">还没有账单项</div>
      <div class="hint">点 + 加新账单项 添加每月固定要还的项目<br>(例: 岳母 / 供车 / 贷款)</div>
    </div>`;
    document.getElementById('monthTotal').textContent = 'RM 0.00';
    document.getElementById('monthTotalSub').textContent = '还没记账';
    document.getElementById('currentMonthStat').textContent = '0 项';
    return;
  }
  
  // 按 createdAt 排序模板
  templates.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  
  let total = 0;
  let paidCount = 0;
  
  document.getElementById('billsList').innerHTML = templates.map(tpl => {
    const entry = monthEntries.find(e => e.templateId === tpl.id);
    const paid = !!entry;
    if (paid) {
      total += parseFloat(entry.amount) || 0;
      paidCount++;
    }
    return `
      <div class="bill-row ${paid ? 'paid' : 'unpaid'}">
        <div class="bill-check ${paid ? 'checked' : ''}" onclick="toggleEntry('${tpl.id}')">${paid ? '✓' : ''}</div>
        <div class="bill-info" onclick="${paid ? `editEntry('${entry.id}')` : `toggleEntry('${tpl.id}')`}">
          <div class="bill-name">${escapeHtml(tpl.name)}</div>
          <div class="bill-meta">
            ${paid ? `${entry.paidDate || '已还'}${entry.note ? ' · <span class="note">' + escapeHtml(entry.note) + '</span>' : ''}` : (tpl.defaultAmount ? `默认 RM ${parseFloat(tpl.defaultAmount).toFixed(2)} · 点击记账` : '还没还款 · 点击记账')}
          </div>
        </div>
        <div class="bill-amount">${paid ? 'RM ' + (parseFloat(entry.amount) || 0).toFixed(2) : (tpl.defaultAmount ? '~RM ' + parseFloat(tpl.defaultAmount).toFixed(2) : '—')}</div>
        <div class="bill-actions">
          <button class="btn-icon" onclick="editTemplate('${tpl.id}')" title="编辑账单项">⚙️</button>
        </div>
      </div>
    `;
  }).join('');
  
  document.getElementById('monthTotal').textContent = `RM ${total.toFixed(2)}`;
  document.getElementById('monthTotalSub').textContent = `已还 ${paidCount} / ${templates.length} 项`;
  document.getElementById('currentMonthStat').textContent = `${paidCount} / ${templates.length} 项已还`;
}

// 切换还款状态: 没记 -> 弹模态框记 | 已记 -> 编辑
window.toggleEntry = async function(templateId) {
  const allEntries = await Store.getAll('entries');
  const existing = allEntries.find(e => e.templateId === templateId && e.year === viewYear && e.month === viewMonth);
  if (existing) {
    editEntry(existing.id);
  } else {
    addEntry(templateId);
  }
};

let editingEntryId = null;
let editingForTemplate = null;

async function addEntry(templateId) {
  editingEntryId = null;
  editingForTemplate = templateId;
  const templates = await Store.getAll('templates');
  const tpl = templates.find(t => t.id === templateId);
  if (!tpl) return;
  document.getElementById('entryModalTitle').textContent = `记还款 · ${tpl.name}`;
  document.getElementById('entryTplName').value = tpl.name;
  // 默认金额: 上个月这项的金额 || 模板默认金额 || 空
  let defaultAmt = '';
  const allEntries = await Store.getAll('entries');
  const lastMonth = viewMonth === 1 ? { year: viewYear - 1, month: 12 } : { year: viewYear, month: viewMonth - 1 };
  const lastEntry = allEntries.find(e => e.templateId === templateId && e.year === lastMonth.year && e.month === lastMonth.month);
  if (lastEntry) defaultAmt = lastEntry.amount;
  else if (tpl.defaultAmount) defaultAmt = tpl.defaultAmount;
  document.getElementById('entryAmount').value = defaultAmt;
  document.getElementById('entryDate').value = todayStr();
  document.getElementById('entryNote').value = '';
  document.getElementById('entryDeleteBtn').classList.add('hidden');
  document.getElementById('entryModal').classList.add('show');
}

window.editEntry = async function(entryId) {
  const allEntries = await Store.getAll('entries');
  const e = allEntries.find(x => x.id === entryId);
  if (!e) return;
  editingEntryId = entryId;
  editingForTemplate = e.templateId;
  const templates = await Store.getAll('templates');
  const tpl = templates.find(t => t.id === e.templateId);
  document.getElementById('entryModalTitle').textContent = `编辑 · ${tpl ? tpl.name : ''}`;
  document.getElementById('entryTplName').value = tpl ? tpl.name : '';
  document.getElementById('entryAmount').value = e.amount;
  document.getElementById('entryDate').value = e.paidDate || todayStr();
  document.getElementById('entryNote').value = e.note || '';
  document.getElementById('entryDeleteBtn').classList.remove('hidden');
  document.getElementById('entryModal').classList.add('show');
};

document.getElementById('entryCancelBtn').addEventListener('click', () => {
  document.getElementById('entryModal').classList.remove('show');
});

document.getElementById('entrySaveBtn').addEventListener('click', async () => {
  const amount = parseFloat(document.getElementById('entryAmount').value);
  const paidDate = document.getElementById('entryDate').value;
  const note = document.getElementById('entryNote').value.trim();
  if (!amount || amount <= 0) { showToast('请输入金额'); return; }
  
  const entry = {
    id: editingEntryId || uuid(),
    templateId: editingForTemplate,
    year: viewYear,
    month: viewMonth,
    amount,
    paidDate: paidDate || todayStr(),
    note,
    updatedAt: Date.now()
  };
  await Store.put('entries', entry);
  document.getElementById('entryModal').classList.remove('show');
  await renderAll();
  debouncePush();
  showToast(editingEntryId ? '✓ 已更新' : '✓ 已记还款');
});

document.getElementById('entryDeleteBtn').addEventListener('click', async () => {
  if (!editingEntryId) return;
  if (!confirm('删除这笔还款记录?(账单项保留)')) return;
  await Store.delete('entries', editingEntryId);
  document.getElementById('entryModal').classList.remove('show');
  await renderAll();
  debouncePush();
  showToast('✓ 已删除');
});

// ============ 账单项 (模板) 操作 ============
let editingTplId = null;

document.getElementById('addTemplateBtn').addEventListener('click', () => {
  editingTplId = null;
  document.getElementById('templateModalTitle').textContent = '+ 加新账单项';
  document.getElementById('tplName').value = '';
  document.getElementById('tplDefault').value = '';
  document.getElementById('tplDeleteBtn').classList.add('hidden');
  document.getElementById('templateModal').classList.add('show');
});

window.editTemplate = async function(id) {
  const templates = await Store.getAll('templates');
  const tpl = templates.find(t => t.id === id);
  if (!tpl) return;
  editingTplId = id;
  document.getElementById('templateModalTitle').textContent = '编辑账单项';
  document.getElementById('tplName').value = tpl.name || '';
  document.getElementById('tplDefault').value = tpl.defaultAmount || '';
  document.getElementById('tplDeleteBtn').classList.remove('hidden');
  document.getElementById('templateModal').classList.add('show');
};

document.getElementById('tplCancelBtn').addEventListener('click', () => {
  document.getElementById('templateModal').classList.remove('show');
});

document.getElementById('tplSaveBtn').addEventListener('click', async () => {
  const name = document.getElementById('tplName').value.trim();
  const defaultAmount = parseFloat(document.getElementById('tplDefault').value) || null;
  if (!name) { showToast('请输入名称'); return; }
  
  const tpl = {
    id: editingTplId || uuid(),
    name,
    defaultAmount,
    createdAt: editingTplId ? undefined : Date.now(),
    updatedAt: Date.now()
  };
  // 保留创建时间
  if (editingTplId) {
    const existing = (await Store.getAll('templates')).find(t => t.id === editingTplId);
    if (existing) tpl.createdAt = existing.createdAt;
  }
  await Store.put('templates', tpl);
  document.getElementById('templateModal').classList.remove('show');
  await renderAll();
  debouncePush();
  showToast(editingTplId ? '✓ 已更新' : '✓ 已添加');
});

document.getElementById('tplDeleteBtn').addEventListener('click', async () => {
  if (!editingTplId) return;
  if (!confirm('删除这个账单项? 所有月份的还款记录也会一起删除!')) return;
  // 删除模板 + 所有相关记录
  const allEntries = await Store.getAll('entries');
  for (const e of allEntries) {
    if (e.templateId === editingTplId) await Store.delete('entries', e.id);
  }
  await Store.delete('templates', editingTplId);
  document.getElementById('templateModal').classList.remove('show');
  await renderAll();
  debouncePush();
  showToast('✓ 已删除');
});

// ============ 复制上月 ============
document.getElementById('copyLastMonthBtn').addEventListener('click', async () => {
  const lastMonth = viewMonth === 1 ? { year: viewYear - 1, month: 12 } : { year: viewYear, month: viewMonth - 1 };
  const allEntries = await Store.getAll('entries');
  const lastMonthEntries = allEntries.filter(e => e.year === lastMonth.year && e.month === lastMonth.month);
  const currMonthEntries = allEntries.filter(e => e.year === viewYear && e.month === viewMonth);
  
  if (lastMonthEntries.length === 0) {
    showToast(`上月 (${lastMonth.year}-${lastMonth.month}) 没有记录`);
    return;
  }
  
  // 只复制本月还没有记录的项目
  const existingTpls = new Set(currMonthEntries.map(e => e.templateId));
  const toCopy = lastMonthEntries.filter(e => !existingTpls.has(e.templateId));
  
  if (toCopy.length === 0) {
    showToast('本月已经全部记过了');
    return;
  }
  
  if (!confirm(`从 ${lastMonth.year}-${lastMonth.month} 复制 ${toCopy.length} 笔到本月? (金额相同,日期改为今天)`)) return;
  
  for (const e of toCopy) {
    await Store.put('entries', {
      id: uuid(),
      templateId: e.templateId,
      year: viewYear,
      month: viewMonth,
      amount: e.amount,
      paidDate: todayStr(),
      note: e.note || '',
      updatedAt: Date.now()
    });
  }
  await renderAll();
  debouncePush();
  showToast(`✓ 已复制 ${toCopy.length} 笔`);
});

// ============ 历史 ============
async function renderHistory() {
  const allEntries = await Store.getAll('entries');
  if (allEntries.length === 0) {
    document.getElementById('historyList').innerHTML = `<div class="empty-state">
      <div class="icon">📊</div>
      <div class="title">还没有还款记录</div>
      <div class="hint">先到 账单 tab 记一笔</div>
    </div>`;
    document.getElementById('totalAllMonths').textContent = 'RM 0.00';
    document.getElementById('totalAllMonthsSub').textContent = '-';
    return;
  }
  
  // 按月分组
  const byMonth = {};
  for (const e of allEntries) {
    const key = monthKey(e.year, e.month);
    if (!byMonth[key]) byMonth[key] = { total: 0, count: 0 };
    byMonth[key].total += parseFloat(e.amount) || 0;
    byMonth[key].count++;
  }
  
  const sortedMonths = Object.keys(byMonth).sort().reverse();
  const recent12 = sortedMonths.slice(0, 12);
  const totalRecent = recent12.reduce((s, k) => s + byMonth[k].total, 0);
  const avgMonthly = recent12.length > 0 ? totalRecent / recent12.length : 0;
  const maxTotal = Math.max(...recent12.map(k => byMonth[k].total));
  
  document.getElementById('totalAllMonths').textContent = `RM ${totalRecent.toFixed(2)}`;
  document.getElementById('totalAllMonthsSub').textContent = `共 ${recent12.length} 个月 · 月均 RM ${avgMonthly.toFixed(2)}`;
  
  document.getElementById('historyList').innerHTML = recent12.map(key => {
    const { year, month } = parseMonthKey(key);
    const { total, count } = byMonth[key];
    const pct = maxTotal > 0 ? (total / maxTotal) * 100 : 0;
    return `
      <div class="history-row" onclick="jumpToMonth(${year}, ${month})">
        <div>
          <div class="history-month">${year}-${String(month).padStart(2,'0')}</div>
          <div class="history-count">${count} 笔</div>
        </div>
        <div class="history-bar-bg">
          <div class="history-bar" style="width: ${pct}%;"></div>
        </div>
        <div class="history-amount">RM ${total.toFixed(2)}</div>
      </div>
    `;
  }).join('');
}

window.jumpToMonth = function(year, month) {
  viewYear = year;
  viewMonth = month;
  // 切到账单 tab
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
  document.querySelector('[data-tab="bills"]').classList.add('active');
  document.getElementById('page-bills').classList.add('active');
  renderBills();
};

// ============ 游戏 ============
function nextGameOccurrence(g) {
  const now = new Date();
  const [hh, mm] = (g.time || '20:00').split(':').map(Number);
  if (g.freq === 'daily') {
    const next = new Date(now);
    next.setHours(hh, mm, 0, 0);
    if (next <= now) next.setDate(next.getDate() + 1);
    return next;
  }
  if (g.freq === 'weekly') {
    const targetDay = parseInt(g.weekday);
    const next = new Date(now);
    next.setHours(hh, mm, 0, 0);
    const dayDiff = (targetDay - next.getDay() + 7) % 7;
    next.setDate(next.getDate() + dayDiff);
    if (next <= now) next.setDate(next.getDate() + 7);
    return next;
  }
  if (g.freq === 'monthly') {
    const targetDay = parseInt(g.dayOfMonth) || 1;
    const next = new Date(now.getFullYear(), now.getMonth(), targetDay, hh, mm, 0, 0);
    if (next <= now) next.setMonth(next.getMonth() + 1);
    return next;
  }
  return null;
}
function formatGameNext(date) {
  if (!date) return '-';
  const now = new Date();
  const diffMs = date - now;
  const diffH = Math.round(diffMs / (60*60*1000));
  const diffD = Math.floor(diffH / 24);
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  const hh = String(date.getHours()).padStart(2, '0');
  const mm = String(date.getMinutes()).padStart(2, '0');
  if (diffH < 1) return `${Math.round(diffMs/60000)} 分钟后`;
  if (diffH < 24) return `${diffH} 小时后 · 今天 ${hh}:${mm}`;
  if (diffD === 1) return `明天 ${hh}:${mm}`;
  if (diffD < 7) return `${diffD} 天后 · ${m}-${d} ${hh}:${mm}`;
  return `${m}-${d} ${hh}:${mm}`;
}

async function renderGames() {
  const games = await Store.getAll('games');
  const list = document.getElementById('gamesList');
  if (games.length === 0) {
    list.innerHTML = `<div class="empty-state">
      <div class="icon">🎮</div>
      <div class="title">还没有游戏活动</div>
      <div class="hint">点 + 添加 加入第一个</div>
    </div>`;
    return;
  }
  const enriched = games.map(g => ({ ...g, next: nextGameOccurrence(g) }));
  enriched.sort((a, b) => (a.next || 9e15) - (b.next || 9e15));
  list.innerHTML = enriched.map(g => {
    const hoursLeft = g.next ? (g.next - Date.now()) / (60*60*1000) : 999;
    const isSoon = hoursLeft < 6;
    return `
      <div class="card" style="${isSoon ? 'border-color: var(--accent-2); background: linear-gradient(135deg, #fff8e8, var(--bg-2));' : ''}">
        <div class="card-head">
          <div class="card-name">${escapeHtml(g.gameName)} · ${escapeHtml(g.eventName)}</div>
        </div>
        <div class="card-meta">
          <div><span class="label">下次:</span> <span class="value" style="${isSoon ? 'color: var(--accent-2); font-weight: 700;' : ''}">${formatGameNext(g.next)}</span></div>
          <div><span class="label">频率:</span> <span class="value">${g.freq === 'daily' ? '每天' : g.freq === 'weekly' ? '每周' : '每月'}</span></div>
          ${g.note ? `<div><span class="label">备注:</span> <span class="value">${escapeHtml(g.note)}</span></div>` : ''}
        </div>
        <div class="card-actions">
          <button class="btn btn-ghost btn-sm" onclick="editGame('${g.id}')">编辑</button>
        </div>
      </div>
    `;
  }).join('');
}

async function renderGamesReminder() {
  const games = await Store.getAll('games');
  const urgent = games.map(g => ({ ...g, next: nextGameOccurrence(g) }))
    .filter(g => g.next && (g.next - Date.now()) < 24 * 60 * 60 * 1000)
    .sort((a, b) => a.next - b.next);
  const el = document.getElementById('gamesReminder');
  if (urgent.length === 0) { el.innerHTML = ''; return; }
  el.innerHTML = `
    <div class="reminder-banner">
      <div class="title">🎮 ${urgent.length} 个活动 24 小时内</div>
      ${urgent.slice(0, 5).map(g => `
        <div class="reminder-item">${escapeHtml(g.gameName)} · ${escapeHtml(g.eventName)} — ${formatGameNext(g.next)}</div>
      `).join('')}
    </div>
  `;
}

let editingGameId = null;
function updateGameFreqFields() {
  const freq = document.getElementById('gameFreq').value;
  document.getElementById('gameWeekdayField').style.display = freq === 'weekly' ? 'block' : 'none';
  document.getElementById('gameDayOfMonthField').style.display = freq === 'monthly' ? 'block' : 'none';
}
document.getElementById('gameFreq').addEventListener('change', updateGameFreqFields);

document.getElementById('addGameBtn').addEventListener('click', () => {
  editingGameId = null;
  document.getElementById('gameModalTitle').textContent = '+ 添加游戏活动';
  document.getElementById('gameName').value = '';
  document.getElementById('gameEvent').value = '';
  document.getElementById('gameFreq').value = 'daily';
  document.getElementById('gameWeekday').value = '1';
  document.getElementById('gameDayOfMonth').value = '';
  document.getElementById('gameTime').value = '20:00';
  document.getElementById('gameNote').value = '';
  document.getElementById('gameDeleteBtn').classList.add('hidden');
  updateGameFreqFields();
  document.getElementById('gameModal').classList.add('show');
});

window.editGame = async function(id) {
  const games = await Store.getAll('games');
  const g = games.find(x => x.id === id);
  if (!g) return;
  editingGameId = id;
  document.getElementById('gameModalTitle').textContent = '编辑游戏活动';
  document.getElementById('gameName').value = g.gameName || '';
  document.getElementById('gameEvent').value = g.eventName || '';
  document.getElementById('gameFreq').value = g.freq || 'daily';
  document.getElementById('gameWeekday').value = g.weekday || '1';
  document.getElementById('gameDayOfMonth').value = g.dayOfMonth || '';
  document.getElementById('gameTime').value = g.time || '20:00';
  document.getElementById('gameNote').value = g.note || '';
  document.getElementById('gameDeleteBtn').classList.remove('hidden');
  updateGameFreqFields();
  document.getElementById('gameModal').classList.add('show');
};

document.getElementById('gameCancelBtn').addEventListener('click', () => {
  document.getElementById('gameModal').classList.remove('show');
});

document.getElementById('gameSaveBtn').addEventListener('click', async () => {
  const gameName = document.getElementById('gameName').value.trim();
  const eventName = document.getElementById('gameEvent').value.trim();
  const freq = document.getElementById('gameFreq').value;
  if (!gameName) { showToast('请输入游戏名'); return; }
  if (!eventName) { showToast('请输入活动名'); return; }
  const game = {
    id: editingGameId || uuid(),
    gameName, eventName, freq,
    weekday: document.getElementById('gameWeekday').value,
    dayOfMonth: document.getElementById('gameDayOfMonth').value,
    time: document.getElementById('gameTime').value,
    note: document.getElementById('gameNote').value.trim(),
    updatedAt: Date.now()
  };
  await Store.put('games', game);
  document.getElementById('gameModal').classList.remove('show');
  await renderAll();
  debouncePush();
  showToast(editingGameId ? '✓ 已更新' : '✓ 已添加');
});

document.getElementById('gameDeleteBtn').addEventListener('click', async () => {
  if (!editingGameId) return;
  if (!confirm('确定删除此活动?')) return;
  await Store.delete('games', editingGameId);
  document.getElementById('gameModal').classList.remove('show');
  await renderAll();
  debouncePush();
  showToast('✓ 已删除');
});

// ============ 数据导出/导入 ============
document.getElementById('exportDataBtn').addEventListener('click', async () => {
  const data = {
    templates: await Store.getAll('templates'),
    entries: await Store.getAll('entries'),
    games: await Store.getAll('games'),
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `bills_${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast(`✓ 已导出 ${data.templates.length} 项 + ${data.entries.length} 笔记录`);
});

document.getElementById('importDataBtn').addEventListener('click', () => {
  document.getElementById('importDataFile').click();
});

document.getElementById('importDataFile').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (!confirm(`将导入 ${(data.templates||[]).length} 个账单项 + ${(data.entries||[]).length} 笔记录\n\n这会覆盖现有数据,确定吗?`)) {
      e.target.value = '';
      return;
    }
    await applyCloudData(data);
    await renderAll();
    debouncePush();
    showToast('✓ 已导入');
  } catch (err) {
    showToast('导入失败: ' + err.message);
  }
  e.target.value = '';
});

// ============ 统计 ============
async function renderStats() {
  document.getElementById('statTemplates').textContent = (await Store.getAll('templates')).length;
  const entries = await Store.getAll('entries');
  const monthSet = new Set(entries.map(e => `${e.year}-${e.month}`));
  document.getElementById('statMonths').textContent = monthSet.size;
  document.getElementById('statGames').textContent = (await Store.getAll('games')).length;
}

// ============ 渲染所有 ============
async function renderAll() {
  await renderBills();
  await renderGames();
  await renderGamesReminder();
  await renderStats();
}

// ============ 启动 ============
async function init() {
  await openDB();
  initCurrentMonth();
  await renderAll();
  
  try {
    const cloud = await pullFromVPS();
    if (cloud) {
      await applyCloudData(cloud);
      await renderAll();
    }
  } catch (e) {
    console.error('Init cloud err:', e);
  }
}

(async () => {
  try {
    const token = localStorage.getItem(STORAGE_TOKEN);
    if (!token) {
      showLoginPage();
    } else {
      hideLoginPage();
      await init();
    }
  } catch (e) {
    console.error('Startup error:', e);
    hideLoginPage();
  }
})();

// ============ Service Worker ============
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      if ('caches' in window) {
        const keys = await caches.keys();
        for (const k of keys) {
          if (!k.includes('v4-')) await caches.delete(k);
        }
      }
      await navigator.serviceWorker.register('./sw.js');
    } catch (e) { console.error('SW err:', e); }
  });
}
</script>
